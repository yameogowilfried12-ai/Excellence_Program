# ============================================================
# This file tells Spring Boot how to connect to YOUR local
# PostgreSQL database. Update the 3 lines below to match what
# you used when you set up Postgres and ran the schema script.
# ============================================================

# Change "sales_marketing_db" to whatever you actually named your database
spring.datasource.url=jdbc:postgresql://localhost:5432/CropCore
spring.datasource.username=postgres
spring.datasource.password=Shema02@

# ============================================================
# This tells Spring "the tables already exist, don't try to
# create/change them yourself" - safe, since you already built
# your schema by hand with the .sql file. "validate" means it
# will just double-check your Java code matches your real tables
# and warn you if something doesn't line up.
# ============================================================
spring.jpa.hibernate.ddl-auto=validate

# Prints the SQL queries Spring runs, in your terminal - very
# useful while learning, to see what's actually happening
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Which port your backend runs on (React will call this)
server.port=8080
