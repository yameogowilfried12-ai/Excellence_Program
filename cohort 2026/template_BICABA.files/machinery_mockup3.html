<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 08 - Machinery Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #0a8276;
            --dark-green: #04574f;
            --light-green: #E8F5E9;
            --accent-green: #4CAF50;
            --accent-orange: #ef6c00;
            --accent-red: #c62828;
            --text-dark: #263238;
            --text-grey: #546E7A;
            --bg-light: #F5F7FA;
            --white: #FFFFFF;
            --border-color: #E0E0E0;
            --sidebar-width: 260px;
            --font-body: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-heading: 'Montserrat', 'Inter', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-green);
            color: var(--white);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar-header { padding: 24px 20px 18px; }
        .sidebar-header .sidebar-logo { display: block; width: 108px; height: auto; margin: 0 auto 18px; }
        .sidebar-header h2 { font-family: var(--font-heading); font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { border: none; border-top: 1px solid rgba(255,255,255,0.25); margin: 0 20px 12px; }
        .nav-menu { list-style: none; padding: 8px 12px; flex-grow: 1; }
        .nav-item {
            padding: 12px 14px; margin-bottom: 4px; display: flex; align-items: center;
            cursor: pointer; transition: all 0.2s ease; border-radius: 8px; color: rgba(255,255,255,0.85);
        }
        .nav-item:hover { background-color: rgba(255,255,255,0.12); color: var(--white); }
        .nav-item.active { background-color: rgba(255,255,255,0.18); color: var(--white); font-weight: 600; }
        .nav-item svg {
            width: 18px; height: 18px; margin-right: 12px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
        }
        .nav-item span { font-size: 14px; font-weight: 500; }
        .sidebar-footer { padding: 16px 12px 20px; }
        .logout-btn {
            width: 100%; display: flex; align-items: center; padding: 12px 14px; border-radius: 8px;
            background: transparent; border: 1px solid rgba(255,255,255,0.3); color: var(--white);
            cursor: pointer; font-family: var(--font-body); font-size: 14px; font-weight: 500; transition: background-color 0.2s ease;
        }
        .logout-btn:hover { background-color: rgba(255,255,255,0.12); }
        .logout-btn svg { width: 18px; height: 18px; margin-right: 10px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar {
            background-color: var(--white); padding: 20px 40px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .top-bar h1 { font-family: var(--font-heading); font-size: 22px; color: var(--dark-green); font-weight: 700; }
        .user-info { display: flex; align-items: center; font-size: 14px; color: var(--text-grey); }
        .user-avatar {
            width: 36px; height: 36px; background-color: var(--light-green); color: var(--primary-green);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-left: 12px;
        }
        .content-area { padding: 30px 40px; overflow-y: auto; flex-grow: 1; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
            background-color: var(--white); padding: 24px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-top: 4px solid var(--accent-green);
        }
        .card h3 { font-size: 14px; color: var(--text-grey); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .card .value { font-size: 32px; font-weight: 700; color: var(--text-dark); }
        .table-container {
            background-color: var(--white); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto;
        }
        .table-header {
            padding: 16px 24px; border-bottom: 1px solid var(--border-color);
            font-family: var(--font-heading); font-weight: 600; color: var(--dark-green);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { text-align: left; padding: 14px 24px; font-size: 14px; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--bg-light); color: var(--text-grey); font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        table tbody tr { transition: background-color 0.15s; }
        table tbody tr:hover { background-color: #f8faf8; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; white-space: nowrap; }
        .badge-operational { background-color: #E8F5E9; color: #2E7D32; }
        .badge-maintenance { background-color: #FFF3E0; color: #EF6C00; }
        .badge-out { background-color: #FFEBEE; color: #C62828; }
        .badge-overdue { background-color: #FFEBEE; color: #C62828; }
        .badge-due-soon { background-color: #FFF3E0; color: #EF6C00; }
        .badge-scheduled { background-color: #E8F5E9; color: #2E7D32; }
        .util-row { display: flex; align-items: center; gap: 12px; }
        .util-track { flex: 1; background-color: var(--bg-light); border-radius: 6px; height: 10px; overflow: hidden; }
        .util-fill { height: 100%; background-color: var(--primary-green); border-radius: 6px; }
        .util-value { width: 56px; text-align: right; font-size: 18px; font-weight: 700; color: var(--primary-green); }

        /* ===== Éléments interactifs ajoutés ===== */
        .btn-add {
            padding: 8px 16px; background-color: var(--primary-green); color: white; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body);
            display: inline-flex; align-items: center; gap: 6px; transition: background-color 0.2s; white-space: nowrap;
        }
        .btn-add:hover { background-color: var(--dark-green); }
        .btn-add svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
        .action-btns { display: flex; gap: 6px; }
        .action-btn {
            width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .action-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .action-btn.edit { background-color: #E3F2FD; color: #1565C0; }
        .action-btn.edit:hover { background-color: #BBDEFB; }
        .action-btn.delete { background-color: #FFEBEE; color: #C62828; }
        .action-btn.delete:hover { background-color: #FFCDD2; }

        /* Modale */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.45);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            background: white; border-radius: 12px; width: 92%; max-width: 560px; max-height: 88vh;
            overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); transform: translateY(12px) scale(0.97);
            transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal { transform: translateY(0) scale(1); }
        .modal-head {
            padding: 18px 24px; background-color: var(--dark-green); color: white;
            border-radius: 12px 12px 0 0; font-family: var(--font-heading); font-size: 16px; font-weight: 600;
        }
        .modal-body { padding: 24px; }
        .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600; color: var(--text-grey);
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px;
            font-size: 14px; font-family: var(--font-body); color: var(--text-dark); transition: border-color 0.2s;
            background: var(--white);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(10,130,118,0.1);
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-group .field-error { color: var(--accent-red); font-size: 12px; margin-top: 4px; display: none; }
        .form-group.has-error input, .form-group.has-error select { border-color: var(--accent-red); }
        .form-group.has-error .field-error { display: block; }
        .btn {
            padding: 10px 22px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: var(--font-body); transition: all 0.2s;
        }
        .btn-primary { background-color: var(--primary-green); color: white; }
        .btn-primary:hover { background-color: var(--dark-green); }
        .btn-ghost { background-color: var(--bg-light); color: var(--text-dark); }
        .btn-ghost:hover { background-color: #e0e0e0; }
        .btn-danger { background-color: var(--accent-red); color: white; }
        .btn-danger:hover { background-color: #b71c1c; }
        .confirm-msg { font-size: 15px; line-height: 1.6; color: var(--text-dark); }
        .confirm-msg strong { color: var(--accent-red); }

        /* État vide */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-grey); }
        .empty-state svg { width: 44px; height: 44px; margin-bottom: 10px; opacity: 0.25; stroke: var(--text-grey); fill: none; stroke-width: 1.5; }
        .empty-state p { font-size: 14px; }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast {
            padding: 13px 20px; border-radius: 8px; color: white; font-size: 14px; font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18); display: flex; align-items: center; gap: 10px;
            animation: toastIn 0.3s ease forwards; pointer-events: auto;
        }
        .toast.removing { animation: toastOut 0.3s ease forwards; }
        .toast.success { background-color: #2E7D32; }
        .toast.error { background-color: #C62828; }
        .toast.info { background-color: var(--primary-green); }
        @keyframes toastIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(110%); opacity: 0; } }

        /* ===== What-If Scenario Analysis ===== */
        .whatif-intro { font-size: 14px; color: var(--text-grey); line-height: 1.6; margin-bottom: 24px; max-width: 760px; }
        .whatif-grid { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
        .whatif-form {
            background-color: var(--white); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 24px; position: sticky; top: 0;
        }
        .whatif-form h3 { font-family: var(--font-heading); font-size: 15px; color: var(--dark-green); margin-bottom: 16px; }
        .whatif-source-tag {
            font-size: 11px; color: var(--primary-green); background-color: var(--light-green);
            padding: 6px 10px; border-radius: 6px; margin-top: 4px; margin-bottom: 16px; line-height: 1.5;
        }
        .whatif-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .whatif-card {
            background-color: var(--white); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 20px; border-top: 4px solid var(--primary-green);
        }
        .whatif-card.cost { border-top-color: var(--accent-orange); }
        .whatif-card.revenue { border-top-color: var(--accent-green); }
        .whatif-card h4 { font-size: 12px; color: var(--text-grey); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .whatif-card .big { font-size: 26px; font-weight: 700; color: var(--text-dark); }
        .whatif-card .sub { font-size: 12px; color: var(--text-grey); margin-top: 6px; line-height: 1.5; }
        .whatif-empty {
            background-color: var(--white); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 40px 24px; text-align: center; color: var(--text-grey); font-size: 14px;
        }
        .whatif-source-note { font-size: 12px; color: var(--text-grey); margin-top: 18px; line-height: 1.6; border-top: 1px solid var(--border-color); padding-top: 14px; }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-header h2, .nav-item span, .logout-btn span { display: none; }
            .nav-item { justify-content: center; padding: 14px 0; }
            .nav-item svg { margin-right: 0; }
            .logout-btn { justify-content: center; padding: 12px; }
            .logout-btn svg { margin-right: 0; }
            .content-area { padding: 20px 16px; }
            .top-bar { padding: 16px 20px; }
            .top-bar h1 { font-size: 18px; }
            .modal { width: 96%; max-height: 92vh; }
            th, td { padding: 10px 14px; font-size: 13px; }
            .whatif-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .sidebar { width: 56px; }
            .sidebar-header { padding: 16px 8px 12px; }
            .sidebar-header .sidebar-logo { width: 32px; }
            .sidebar-divider { margin: 0 10px 8px; }
            .nav-menu { padding: 4px 6px; }
            .nav-item { padding: 12px 0; margin-bottom: 2px; }
            .nav-item svg { width: 17px; height: 17px; }
            .top-bar { padding: 12px 14px; }
            .top-bar h1 { font-size: 15px; }
            .user-info { font-size: 0; }
            .user-avatar { margin-left: 0; width: 32px; height: 32px; font-size: 12px; }
            .content-area { padding: 14px 10px; }
            .grid-cards { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
            .card { padding: 14px; }
            .card h3 { font-size: 11px; margin-bottom: 6px; }
            .card .value { font-size: 22px; }
            .table-header { padding: 12px 14px; font-size: 14px; }
            th, td { padding: 9px 10px; font-size: 12px; }
            .util-value { width: 42px; font-size: 15px; }
            .btn-add span { display: none; }
            .btn-add { padding: 8px 10px; }
            .modal { width: 100%; max-width: 100%; height: 100%; max-height: 100%; border-radius: 0; }
            .modal-body { padding: 16px; }
            .modal-foot { padding: 12px 16px; flex-wrap: wrap; }
            .modal-foot .btn { flex: 1; }
            .toast-container { left: 10px; right: 10px; top: 10px; }
            .toast { font-size: 13px; }
            .whatif-results { grid-template-columns: 1fr; }
        }
    </style>
</head>

    /* Calcule l'impact coût / capacité / utilisation d'un scénario d'ajout d'équipement */
    function computeWhatIf(itemId, qty) {
        const item = WHATIF_CATALOG.find(i => i.id === itemId);
        if (!item || !qty || qty < 1) return null;

        const capex = item.unitCost * qty;

        /* Utilisation actuelle de la flotte, basée sur DB.utilization */
        const totalHours = DB.utilization.reduce((s, u) => s + u.hoursUsed, 0);
        const totalAvailable = DB.utilization.reduce((s, u) => s + u.availableHours, 0);
        const currentRate = totalAvailable > 0 ? totalHours / totalAvailable : 0;

        /* Hypothèse de montée en charge : un équipement neuf tourne en général
           en dessous de la moyenne de la flotte le temps de sa mise en service (~50%) */
        const RAMP_UP_FACTOR = 0.5;
        const addedAvailable = 40 * qty; /* base hebdomadaire de 40h, cohérente avec le reste du dashboard */
        const addedUsed = addedAvailable * currentRate * RAMP_UP_FACTOR;
        const projectedRate = (totalHours + addedUsed) / (totalAvailable + addedAvailable);

        const result = {
            item, qty, capex,
            currentRatePct: Math.round(currentRate * 100),
            projectedRatePct: Math.round(projectedRate * 100),
        };

        /* Pour le dryer uniquement : projection de capacité et de revenu, basée sur des données réelles sourcées */
        if (item.capacityPerCycleKg) {
            const freshCapacityKg = item.capacityPerCycleKg * item.maxCyclesPerCampaign * qty;
            const driedOutputKg = freshCapacityKg * item.yieldRatio;
            const revenuePotential = driedOutputKg * item.exportPricePerKg;
            const paybackYears = revenuePotential > 0 ? capex / revenuePotential : null;
            Object.assign(result, { freshCapacityKg, driedOutputKg, revenuePotential, paybackYears });
        }

        return result;
    }

            const stepAttr = f.step ? `step="${f.step}"` : '';

            if (f.type === 'select') {
                input = `<select name="${f.key}" ${reqAttr}>${f.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
            } else if (f.type === 'asset-select') {
                input = `<select name="${f.key}" ${reqAttr}><option value="">-- Select --</option>${DB.equipment.map(e => `<option value="${e.id}" ${val === e.id ? 'selected' : ''}>${e.id} — ${e.name}</option>`).join('')}</select>`;
            } else if (f.type === 'textarea') {
                input = `<textarea name="${f.key}" ${reqAttr} placeholder="${f.placeholder || ''}">${val}</textarea>`;
            } else {
                input = `<input type="${f.type || 'text'}" name="${f.key}" value="${val}" ${stepAttr} ${reqAttr} placeholder="${f.placeholder || ''}">`;
            }
            return `<div class="form-group"><label>${f.label}</label>${input}<div class="field-error">This field is required.</div></div>`;
        }).join('');
    }

    /* Sauvegarde (ajout ou mise à jour) */
    function saveItem() {
        const { key, index } = currentEdit;
        const cfg = ENTITY[key];
        const form = modalBody;
        const data = {};
        let valid = true;

        /* Collecter et valider */
        cfg.fields.forEach(f => {
            const el = form.querySelector(`[name="${f.key}"]`);
            const group = el.closest('.form-group');
            let val = el.value.trim();
            if (f.type === 'number' && val !== '') val = parseFloat(val);
            data[f.key] = val;
            if (f.required && (val === '' || val === null || val === undefined || (typeof val === 'number' && isNaN(val)))) {
                group.classList.add('has-error');
                valid = false;
            } else {
                group.classList.remove('has-error');
            }
        });

        if (!valid) return;

        if (index === -1) {
            /* Ajout */
            data.id = genId(key);
            DB[key].push(data);
            toast('Record added successfully', 'success');
        } else {
            /* Mise à jour */
            data.id = DB[key][index].id; /* conserver l'ID */
            DB[key][index] = data;
            toast('Record updated successfully', 'success');
        }

        hideModal();
        renderAll();
    }

    /* ============================================================
       MODALE — Confirmation de suppression
       ============================================================ */
    function confirmDelete(key, index) {
        const item = DB[key][index];
        const label = item.id || item.name || 'this record';
        modalHead.textContent = 'Confirm Deletion';
        modalBody.innerHTML = `<div class="confirm-msg">Are you sure you want to delete <strong>${label}</strong>? This action cannot be undone.</div>`;
        modalFoot.innerHTML = `<button class="btn btn-ghost" onclick="hideModal()">Cancel</button><button class="btn btn-danger" onclick="doDelete()">Delete</button>`;
        currentEdit = { key, index };
        showModal();
    }

    function doDelete() {
        const { key, index } = currentEdit;
        DB[key].splice(index, 1);
        hideModal();
        toast('Record deleted', 'error');
        renderAll();
    }

    /* ============================================================
       TOASTS
       ============================================================ */
    function toast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${type === 'success' ? '<path d="M20 6L9 17l-5-5"></path>' : type === 'error' ? '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>' : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'}</svg>${msg}`;
        container.appendChild(el);
        setTimeout(() => { el.classList.add('removing'); }, 2600);
        setTimeout(() => { el.remove(); }, 2900);
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    const TITLES = {
        dashboard:'Dashboard Overview', equipment:'Equipment Registry',
        maintenance:'Maintenance Schedule', usage:'Usage & Fuel Log',
        repairs:'Repair Log', operators:'Operator Assignment', spares:'Spare Parts Inventory',
        whatif:'What-If Scenario Analysis'
    };

    function renderAll() {
        renderDashboard();
        renderEquipment();
        renderMaintenance();
        renderUsage();
        renderRepairs();
        renderOperators();
        renderSpares();
        renderWhatIf();
    }

    /* Construit le formulaire + les résultats (vides tant qu'aucune simulation n'a été lancée) */
    function renderWhatIf(result) {
        const optionsByCategory = {};
        WHATIF_CATALOG.forEach(item => {
            if (!optionsByCategory[item.category]) optionsByCategory[item.category] = [];
            optionsByCategory[item.category].push(item);
        });
        const selectOptions = Object.entries(optionsByCategory).map(([cat, items]) =>
            `<optgroup label="${cat}">${items.map(i => `<option value="${i.id}">${i.label} — €${i.unitCost.toLocaleString()}</option>`).join('')}</optgroup>`
        ).join('');

        let html = `
        <div class="whatif-intro">Simulate the cost and capacity impact of adding equipment to the fleet before making a purchase decision. Unit costs and dryer capacity figures below are sourced from the 2025 cohort's cost data, not placeholders.</div>
        <div class="whatif-grid">
            <div class="whatif-form">
                <h3>Scenario Setup</h3>
                <div class="form-group">
                    <label>Equipment to add</label>
                    <select id="whatif-item">${selectOptions}</select>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="whatif-qty" value="1" min="1" max="20">
                </div>
                <div class="whatif-source-tag" id="whatif-source-tag"></div>
                <button class="btn btn-primary" style="width:100%;" onclick="runWhatIf()">Run Simulation</button>
            </div>
            <div id="whatif-output"></div>
        </div>`;

        document.getElementById('whatif').innerHTML = html;

        const itemSelect = document.getElementById('whatif-item');
        const updateSourceTag = () => {
            const item = WHATIF_CATALOG.find(i => i.id === itemSelect.value);
            document.getElementById('whatif-source-tag').textContent = 'Source: ' + item.source;
        };
        itemSelect.addEventListener('change', updateSourceTag);
        updateSourceTag();

        const output = document.getElementById('whatif-output');
        if (result) {
            output.innerHTML = whatIfResultHTML(result);
        } else {
            output.innerHTML = `<div class="whatif-empty">Choose an equipment type and quantity, then run the simulation to see the projected cost and capacity impact.</div>`;
        }
    }

    function whatIfResultHTML(r) {
        let html = `<div class="whatif-results">
            <div class="whatif-card cost">
                <h4>Additional CAPEX</h4>
                <div class="big">€${r.capex.toLocaleString()}</div>
                <div class="sub">${r.qty} × ${r.item.label} at €${r.item.unitCost.toLocaleString()} each</div>
            </div>
            <div class="whatif-card">
                <h4>Fleet Utilization</h4>
                <div class="big">${r.currentRatePct}% → ${r.projectedRatePct}%</div>
                <div class="sub">Assumes the new unit ramps up at ~50% of the current fleet average during its first weeks in service.</div>
            </div>`;

        if (r.driedOutputKg !== undefined) {
            html += `
            <div class="whatif-card revenue">
                <h4>Added Processing Capacity</h4>
                <div class="big">${Math.round(r.driedOutputKg).toLocaleString()} kg</div>
                <div class="sub">Dried mango output potential per 4-month campaign (${Math.round(r.freshCapacityKg).toLocaleString()} kg fresh input at full capacity)</div>
            </div>
            <div class="whatif-card revenue">
                <h4>Revenue Potential</h4>
                <div class="big">€${Math.round(r.revenuePotential).toLocaleString()}</div>
                <div class="sub">At 30 €/kg export price. Estimated payback: ${r.paybackYears < 1 ? Math.round(r.paybackYears * 12) + ' months' : r.paybackYears.toFixed(1) + ' years'} at full capacity utilization.</div>
            </div>`;
        }

        html += `</div>
        <div class="whatif-source-note">This simulation is a planning estimate, not a financial guarantee. CAPEX and dryer capacity figures come from the 2025 cohort's sourced cost data; utilization ramp-up and payback assume full, uninterrupted capacity use.</div>`;
        return html;
    }

    function runWhatIf() {
        const itemId = document.getElementById('whatif-item').value;
        const qty = parseInt(document.getElementById('whatif-qty').value, 10);
        const result = computeWhatIf(itemId, qty);
        if (result) {
            document.getElementById('whatif-output').innerHTML = whatIfResultHTML(result);
            toast('Scenario simulated', 'success');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderAll();

        const navItems = document.querySelectorAll('.nav-item');
        const pages = document.querySelectorAll('.page');
        const pageTitle = document.getElementById('page-title');

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const target = item.getAttribute('data-page');
                navItems.forEach(n => n.classList.remove('active'));
                pages.forEach(p => p.classList.remove('active'));
                item.classList.add('active');
                document.getElementById(target).classList.add('active');
                pageTitle.textContent = TITLES[target];
            });
        });

        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                logoutBtn.querySelector('span').textContent = 'Logged out';
                logoutBtn.disabled = true;
                logoutBtn.style.opacity = '0.6';
            });
        }
    });
    </script>
</body>
</html>
