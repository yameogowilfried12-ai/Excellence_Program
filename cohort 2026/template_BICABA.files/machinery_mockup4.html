<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 08 - Machinery Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #0a8276;
            --dark-green: #04574f;
            --light-green: #E8F5E9;
            --accent-green: #4CAF50;
            --accent-orange: #ef6c00;
            --accent-red: #c62828;
            --text-dark: #263238;
            --text-grey: #546E7A;
            --bg-light: #F5F7FA;
            --white: #FFFFFF;
            --border-color: #E0E0E0;
            --sidebar-width: 260px;
            --font-body: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-heading: 'Montserrat', 'Inter', system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-green);
            color: var(--white);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar-header { padding: 24px 20px 18px; }
        .sidebar-header .sidebar-logo { display: block; width: 108px; height: auto; margin: 0 auto 18px; }
        .sidebar-header h2 { font-family: var(--font-heading); font-size: 13px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .sidebar-divider { border: none; border-top: 1px solid rgba(255,255,255,0.25); margin: 0 20px 12px; }
        .nav-menu { list-style: none; padding: 8px 12px; flex-grow: 1; }
        .nav-item {
            padding: 12px 14px; margin-bottom: 4px; display: flex; align-items: center;
            cursor: pointer; transition: all 0.2s ease; border-radius: 8px; color: rgba(255,255,255,0.85);
        }
        .nav-item:hover { background-color: rgba(255,255,255,0.12); color: var(--white); }
        .nav-item.active { background-color: rgba(255,255,255,0.18); color: var(--white); font-weight: 600; }
        .nav-item svg {
            width: 18px; height: 18px; margin-right: 12px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
        }
        .nav-item span { font-size: 14px; font-weight: 500; }
        .sidebar-footer { padding: 16px 12px 20px; }
        .logout-btn {
            width: 100%; display: flex; align-items: center; padding: 12px 14px; border-radius: 8px;
            background: transparent; border: 1px solid rgba(255,255,255,0.3); color: var(--white);
            cursor: pointer; font-family: var(--font-body); font-size: 14px; font-weight: 500; transition: background-color 0.2s ease;
        }
        .logout-btn:hover { background-color: rgba(255,255,255,0.12); }
        .logout-btn svg { width: 18px; height: 18px; margin-right: 10px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar {
            background-color: var(--white); padding: 20px 40px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .top-bar h1 { font-family: var(--font-heading); font-size: 22px; color: var(--dark-green); font-weight: 700; }
        .user-info { display: flex; align-items: center; font-size: 14px; color: var(--text-grey); }
        .user-avatar {
            width: 36px; height: 36px; background-color: var(--light-green); color: var(--primary-green);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; margin-left: 12px;
        }
        .content-area { padding: 30px 40px; overflow-y: auto; flex-grow: 1; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        /* ===== What-If : mise en page "une vue, pas de scroll" (desktop/tablette) ===== */
        @media (min-width: 769px) and (min-height: 620px) {
            #whatif.page.active {
                display: flex; flex-direction: column; height: 100%; animation: fadeIn 0.3s ease-in-out;
            }
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card {
            background-color: var(--white); padding: 24px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-top: 4px solid var(--accent-green);
        }
        .card h3 { font-size: 14px; color: var(--text-grey); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .card .value { font-size: 32px; font-weight: 700; color: var(--text-dark); }
        .table-container {
            background-color: var(--white); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto;
        }
        .table-header {
            padding: 16px 24px; border-bottom: 1px solid var(--border-color);
            font-family: var(--font-heading); font-weight: 600; color: var(--dark-green);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { text-align: left; padding: 14px 24px; font-size: 14px; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--bg-light); color: var(--text-grey); font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        table tbody tr { transition: background-color 0.15s; }
        table tbody tr:hover { background-color: #f8faf8; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; white-space: nowrap; }
        .badge-operational { background-color: #E8F5E9; color: #2E7D32; }
        .badge-maintenance { background-color: #FFF3E0; color: #EF6C00; }
        .badge-out { background-color: #FFEBEE; color: #C62828; }
        .badge-overdue { background-color: #FFEBEE; color: #C62828; }
        .badge-due-soon { background-color: #FFF3E0; color: #EF6C00; }
        .badge-scheduled { background-color: #E8F5E9; color: #2E7D32; }
        .util-row { display: flex; align-items: center; gap: 12px; }
        .util-track { flex: 1; background-color: var(--bg-light); border-radius: 6px; height: 10px; overflow: hidden; }
        .util-fill { height: 100%; background-color: var(--primary-green); border-radius: 6px; }
        .util-value { width: 56px; text-align: right; font-size: 18px; font-weight: 700; color: var(--primary-green); }

        /* ===== Éléments interactifs ajoutés ===== */
        .btn-add {
            padding: 8px 16px; background-color: var(--primary-green); color: white; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body);
            display: inline-flex; align-items: center; gap: 6px; transition: background-color 0.2s; white-space: nowrap;
        }
        .btn-add:hover { background-color: var(--dark-green); }
        .btn-add svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
        .action-btns { display: flex; gap: 6px; }
        .action-btn {
            width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .action-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .action-btn.edit { background-color: #E3F2FD; color: #1565C0; }
        .action-btn.edit:hover { background-color: #BBDEFB; }
        .action-btn.delete { background-color: #FFEBEE; color: #C62828; }
        .action-btn.delete:hover { background-color: #FFCDD2; }

        /* Modale */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.45);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            background: white; border-radius: 12px; width: 92%; max-width: 560px; max-height: 88vh;
            overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); transform: translateY(12px) scale(0.97);
            transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal { transform: translateY(0) scale(1); }
        .modal-head {
            padding: 18px 24px; background-color: var(--dark-green); color: white;
            border-radius: 12px 12px 0 0; font-family: var(--font-heading); font-size: 16px; font-weight: 600;
        }
        .modal-body { padding: 24px; }
        .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600; color: var(--text-grey);
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px;
            font-size: 14px; font-family: var(--font-body); color: var(--text-dark); transition: border-color 0.2s;
            background: var(--white);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(10,130,118,0.1);
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-group .field-error { color: var(--accent-red); font-size: 12px; margin-top: 4px; display: none; }
        .form-group.has-error input, .form-group.has-error select { border-color: var(--accent-red); }
        .form-group.has-error .field-error { display: block; }
        .btn {
            padding: 10px 22px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
            cursor: pointer; font-family: var(--font-body); transition: all 0.2s;
        }
        .btn-primary { background-color: var(--primary-green); color: white; }
        .btn-primary:hover { background-color: var(--dark-green); }
        .btn-ghost { background-color: var(--bg-light); color: var(--text-dark); }
        .btn-ghost:hover { background-color: #e0e0e0; }
        .btn-danger { background-color: var(--accent-red); color: white; }
        .btn-danger:hover { background-color: #b71c1c; }
        .confirm-msg { font-size: 15px; line-height: 1.6; color: var(--text-dark); }
        .confirm-msg strong { color: var(--accent-red); }

        /* État vide */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-grey); }
        .empty-state svg { width: 44px; height: 44px; margin-bottom: 10px; opacity: 0.25; stroke: var(--text-grey); fill: none; stroke-width: 1.5; }
        .empty-state p { font-size: 14px; }

        /* Toast */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast {
            padding: 13px 20px; border-radius: 8px; color: white; font-size: 14px; font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18); display: flex; align-items: center; gap: 10px;
            animation: toastIn 0.3s ease forwards; pointer-events: auto;
        }
        .toast.removing { animation: toastOut 0.3s ease forwards; }
        .toast.success { background-color: #2E7D32; }
        .toast.error { background-color: #C62828; }
        .toast.info { background-color: var(--primary-green); }
        @keyframes toastIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(110%); opacity: 0; } }

        /* ===== What-If Scenario Analysis ===== */
        .whatif-intro { font-size: 13px; color: var(--text-grey); line-height: 1.5; margin-bottom: 16px; max-width: 760px; flex-shrink: 0; }
        .whatif-layout { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: stretch; flex: 1; min-height: 0; }

        .whatif-panel {
            background-color: var(--white); border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 20px;
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .whatif-panel-title {
            display: flex; align-items: center; gap: 8px; font-family: var(--font-heading); font-size: 14px;
            font-weight: 700; color: var(--text-dark); margin-bottom: 14px; flex-shrink: 0;
        }
        .whatif-panel-title svg { width: 17px; height: 17px; stroke: var(--dark-green); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .whatif-field { margin-bottom: 16px; }
        .whatif-field-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; }
        .whatif-field-label .val { color: var(--primary-green); font-weight: 700; font-size: 12.5px; }
        .whatif-select {
            width: 100%; padding: 9px 11px; border: 1px solid var(--border-color); border-radius: 6px;
            font-family: var(--font-body); font-size: 12.5px; color: var(--text-dark); background: var(--white);
        }
        .whatif-slider {
            width: 100%; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px;
            background: var(--border-color); outline: none; cursor: pointer;
        }
        .whatif-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--primary-green); cursor: pointer; border: 3px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .whatif-slider::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%; background: var(--primary-green); cursor: pointer;
            border: 3px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .whatif-toggle-card {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background-color: var(--bg-light); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px;
        }
        .whatif-toggle-text strong { display: block; font-size: 12.5px; color: var(--text-dark); margin-bottom: 3px; }
        .whatif-toggle-text span { font-size: 11px; color: var(--text-grey); line-height: 1.35; }
        .whatif-switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
        .whatif-switch input { opacity: 0; width: 0; height: 0; }
        .whatif-switch .slider-el { position: absolute; cursor: pointer; inset: 0; background-color: #CFD8DC; transition: 0.2s; border-radius: 24px; }
        .whatif-switch .slider-el:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: 0.2s; border-radius: 50%; }
        .whatif-switch input:checked + .slider-el { background-color: var(--primary-green); }
        .whatif-switch input:checked + .slider-el:before { transform: translateX(18px); }

        .whatif-source-tag {
            font-size: 10.5px; color: var(--primary-green); background-color: var(--light-green);
            padding: 7px 9px; border-radius: 6px; line-height: 1.45; margin-top: auto;
        }

        .whatif-results-panel {
            background-color: var(--white); border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 20px;
            display: flex; flex-direction: column; min-height: 0; overflow: hidden;
        }
        #whatif-rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; flex-shrink: 0; margin-bottom: 12px; }
        .whatif-result-row { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background-color: var(--bg-light); border-radius: 8px; }
        .whatif-result-row .label { font-size: 11px; color: var(--text-grey); }
        .whatif-result-row .value { font-size: 15px; font-weight: 700; color: var(--text-dark); line-height: 1.2; }
        .whatif-result-row .value.positive { color: #2E7D32; }
        .whatif-result-row .value.muted { color: var(--text-grey); font-weight: 500; font-style: italic; font-size: 12px; }

        .whatif-chart-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .whatif-chart-title { font-size: 11px; color: var(--text-grey); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; flex-shrink: 0; }
        .whatif-chart-canvas-box { flex: 1; min-height: 0; position: relative; }
        .whatif-chart-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 11px; color: var(--text-grey); flex-shrink: 0; }
        .whatif-chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .whatif-chart-legend .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
        .whatif-source-note { font-size: 10.5px; color: var(--text-grey); margin-top: 8px; line-height: 1.4; flex-shrink: 0; }

        /* Responsive */
        /* ===== What-If : fallback mobile/petite hauteur -> page normale scrollable ===== */
        @media (max-width: 768px), (max-height: 619px) {
            .whatif-layout { grid-template-columns: 1fr; }
            .whatif-chart-canvas-box { height: 260px; }
            .whatif-panel, .whatif-results-panel { max-height: none; overflow: visible; }
        }
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-header h2, .nav-item span, .logout-btn span { display: none; }
            .nav-item { justify-content: center; padding: 14px 0; }
            .nav-item svg { margin-right: 0; }
            .logout-btn { justify-content: center; padding: 12px; }
            .logout-btn svg { margin-right: 0; }
            .content-area { padding: 20px 16px; }
            .top-bar { padding: 16px 20px; }
            .top-bar h1 { font-size: 18px; }
            .modal { width: 96%; max-height: 92vh; }
            th, td { padding: 10px 14px; font-size: 13px; }
        }
        @media (max-width: 480px) {
            .sidebar { width: 56px; }
            .sidebar-header { padding: 16px 8px 12px; }
            .sidebar-header .sidebar-logo { width: 32px; }
            .sidebar-divider { margin: 0 10px 8px; }
            .nav-menu { padding: 4px 6px; }
            .nav-item { padding: 12px 0; margin-bottom: 2px; }
            .nav-item svg { width: 17px; height: 17px; }
            .top-bar { padding: 12px 14px; }
            .top-bar h1 { font-size: 15px; }
            .user-info { font-size: 0; }
            .user-avatar { margin-left: 0; width: 32px; height: 32px; font-size: 12px; }
            .content-area { padding: 14px 10px; }
            .grid-cards { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
            .card { padding: 14px; }
            .card h3 { font-size: 11px; margin-bottom: 6px; }
            .card .value { font-size: 22px; }
            .table-header { padding: 12px 14px; font-size: 14px; }
            th, td { padding: 9px 10px; font-size: 12px; }
            .util-value { width: 42px; font-size: 15px; }
            .btn-add span { display: none; }
            .btn-add { padding: 8px 10px; }
            .modal { width: 100%; max-width: 100%; height: 100%; max-height: 100%; border-radius: 0; }
            .modal-body { padding: 16px; }
            .modal-foot { padding: 12px 16px; flex-wrap: wrap; }
            .modal-foot .btn { flex: 1; }
            .toast-container { left: 10px; right: 10px; top: 10px; }
            .toast { font-size: 13px; }
            .whatif-chart-legend { gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->

    <script>
    /* ============================================================

    const DB = {
        equipment: [
            { id:'MCH-001', name:'Tractor / power tiller', category:'Agricultural machinery', stage:'Cultivation', source:'Zalka', status:'Operational' },

            { id:'MCH-010', name:'Peeler', category:'Processing machinery', stage:'Processing', source:'Cedric', status:'Out of service' },
        ],
        maintenance: [
            { id:'MT-001', assetId:'MCH-001', type:'Preventive', frequency:'Every 250 hours', lastCompleted:'2026-07-10', nextDue:'2026-08-05', operator:'Wilfried Y.' },
            { id:'MT-002', assetId:'MCH-009', type:'Corrective', frequency:'N/A', lastCompleted:'2026-07-22', nextDue:'2026-07-25', operator:'Abdoul S.' },
            { id:'MT-003', assetId:'MCH-006', type:'Preventive', frequency:'Every 3 months', lastCompleted:'2026-05-15', nextDue:'2026-08-15', operator:'Jean-Louis R.' },
        ],
        usageLogs: [
            { id:'LOG-01', assetId:'MCH-001', date:'2026-07-23', hoursUsed:6.5, operator:'Wilfried Y.', notes:'Plowing field section B' },
            { id:'LOG-02', assetId:'MCH-002', date:'2026-07-23', hoursUsed:4.0, operator:'Yienouyaba P.', notes:'Morning irrigation cycle' },
        ],
        fuelLogs: [
            { id:'F-01', assetId:'MCH-001', date:'2026-07-22', liters:25.0, cost:37.50 },
            { id:'F-02', assetId:'MCH-002', date:'2026-07-21', liters:10.5, cost:15.75 },
        ],
        repairLogs: [
            { id:'REP-01', assetId:'MCH-009', date:'2026-07-22', issue:'Heating element malfunction', downtime:14.0, cost:150.00, technician:'Maintenance Team A' },

            { id:'AS-02', name:'Yienouyaba Phares', assetId:'MCH-002', role:'Technician', startDate:'2026-05-01', endDate:'-' },
            { id:'AS-03', name:'Abdoul Ben Fatao Sanon', assetId:'MCH-009', role:'Supervisor', startDate:'2026-07-01', endDate:'-' },
        ],
        spareParts: [
            { id:'SP-01', name:'Engine Oil Filter', assetId:'MCH-001', qty:5, threshold:2, unitCost:15.00 },
            { id:'SP-02', name:'Heating Element', assetId:'MCH-009', qty:1, threshold:2, unitCost:45.00 },
            { id:'SP-03', name:'Drive Belt', assetId:'MCH-010', qty:0, threshold:1, unitCost:25.00 },
            { id:'SP-04', name:'Water Seal Gasket', assetId:'MCH-002', qty:4, threshold:2, unitCost:8.50 },
        ],
        utilization: [
            { assetId:'MCH-001', name:'Tractor / power tiller', hoursUsed:32.0, availableHours:40.0 },
            { assetId:'MCH-002', name:'Motor pump (irrigation asset)', hoursUsed:18.0, availableHours:40.0 },
            { assetId:'MCH-007', name:'Sorter', hoursUsed:25.0, availableHours:40.0 },
            { assetId:'MCH-009', name:'Dryer', hoursUsed:35.0, availableHours:40.0 },
        ]
    };

    /* Compteurs pour la génération d'IDs auto */
    const ID_COUNTERS = { equipment:11, maintenance:4, usageLogs:3, fuelLogs:3, repairLogs:3, operators:4, spareParts:5 };
    const ID_PREFIXES = { equipment:'MCH', maintenance:'MT', usageLogs:'LOG', fuelLogs:'F', repairLogs:'REP', operators:'AS', spareParts:'SP' };
    const ID_PAD = { equipment:3, maintenance:3, usageLogs:2, fuelLogs:2, repairLogs:3, operators:2, spareParts:2 };

    function genId(key) {
        const n = ID_COUNTERS[key]++;
        return ID_PREFIXES[key] + String(n).padStart(ID_PAD[key], '0');
    }

    /* ============================================================
       CATALOGUE "WHAT-IF" — coûts et capacités réels, sourcés du
       jeu de données 2025 (feuilles Plants(Zalka) et Smart Dryer(Cedric))
       ============================================================ */
    const WHATIF_CATALOG = [
        { id:'tractor', label:'Tractor / power tiller', category:'Agricultural machinery', unitCost:6860,
          source:'2025 cohort cost data — Plants sheet (Zalka), mini tractor line item' },
        { id:'motorpump', label:'Motor pump + hose kit (irrigation)', category:'Agricultural machinery', unitCost:4573,
          source:'2025 cohort cost data — Plants sheet (Zalka)' },
        { id:'plantingtools', label:'Planting & harvesting tool set', category:'Agricultural equipment', unitCost:1829,
          source:'2025 cohort cost data — Plants sheet (Zalka), itemized bibliography' },
        { id:'postharvest', label:'Post-harvest handling equipment', category:'Agricultural equipment', unitCost:2286,
          source:'2025 cohort cost data — Plants sheet (Zalka), itemized bibliography' },
        { id:'elevator', label:'Elevator', category:'Processing machinery', unitCost:909,
          source:'2025 cohort cost data — Smart Dryer sheet (Cedric)' },
        { id:'washer', label:'Bubble washer', category:'Processing machinery', unitCost:1060,
          source:'2025 cohort cost data — Smart Dryer sheet (Cedric)' },
        { id:'sorter', label:'Sorter', category:'Processing machinery', unitCost:2271,
          source:'2025 cohort cost data — Smart Dryer sheet (Cedric)' },
        { id:'cleaner', label:'Cleaner', category:'Processing machinery', unitCost:758,
          source:'2025 cohort cost data — Smart Dryer sheet (Cedric)' },
        { id:'dryer', label:'Dryer', category:'Processing machinery', unitCost:2651,
          source:'2025 cohort cost data — Smart Dryer sheet (Cedric)',
          capacityPerCycleKg:500, conservativeCyclesPerYear:8, maxCyclesPerCampaign:32, yieldRatio:0.1, exportPricePerKg:30,
          capacitySource:'Conservative: 8 cycles/year, matching the 2025 farm model\'s actual usage (16 cycles \u00f7 2 dryers). Full capacity: up to 32 cycles per 4-month campaign (theoretical max). Yield: 10% fresh-to-dried ratio. Export price: 30 \u20ac/kg dried, gebana catalogue (2025 bibliography).' },
        { id:'peeler', label:'Peeler', category:'Processing machinery', unitCost:1212,
          source:'2025 cohort cost data — Smart Dryer sheet (Cedric)' },
    ];

    /* Calcule l'impact coût / capacité / utilisation d'un scénario d'ajout d'équipement,
       et prépare les points nécessaires au graphique de zones (bénéfice / seuil / perte) */
    function computeWhatIf(itemId, qty, fullCapacity) {
        const item = WHATIF_CATALOG.find(i => i.id === itemId);
        if (!item || !qty || qty < 1) return null;

        const capex = item.unitCost * qty;

        /* Utilisation actuelle de la flotte, basée sur DB.utilization */
        const totalHours = DB.utilization.reduce((s, u) => s + u.hoursUsed, 0);
        const totalAvailable = DB.utilization.reduce((s, u) => s + u.availableHours, 0);
        const currentRate = totalAvailable > 0 ? totalHours / totalAvailable : 0;

        /* Hypothèse de montée en charge : un équipement neuf tourne en général
           en dessous de la moyenne de la flotte le temps de sa mise en service (~50%) */
        const RAMP_UP_FACTOR = 0.5;
        const addedAvailable = 40 * qty; /* base hebdomadaire de 40h, cohérente avec le reste du dashboard */
        const addedUsed = addedAvailable * currentRate * RAMP_UP_FACTOR;
        const projectedRate = (totalHours + addedUsed) / (totalAvailable + addedAvailable);

        const result = {
            item, qty, capex,
            currentRatePct: Math.round(currentRate * 100),
            projectedRatePct: Math.round(projectedRate * 100),
        };

        if (item.capacityPerCycleKg) {
            /* ===== Équipement avec économie sourcée (Dryer) : graphique financier ===== */
            const cyclesPerYear = fullCapacity ? item.maxCyclesPerCampaign : item.conservativeCyclesPerYear;
            const freshCapacityKg = item.capacityPerCycleKg * cyclesPerYear * qty;
            const driedOutputKg = freshCapacityKg * item.yieldRatio;
            const revenuePotential = driedOutputKg * item.exportPricePerKg;
            const monthlyBenefit = revenuePotential / 12;
            const paybackMonths = monthlyBenefit > 0 ? capex / monthlyBenefit : null;

            const horizonMonths = paybackMonths ? Math.max(12, Math.ceil(paybackMonths * 2.2 / 6) * 6) : 24;
            const points = [];
            for (let m = 0; m <= horizonMonths; m += Math.max(1, Math.round(horizonMonths / 24))) {
                points.push({ x: m, y: -capex + monthlyBenefit * m });
            }
            points.push({ x: horizonMonths, y: -capex + monthlyBenefit * horizonMonths });

            Object.assign(result, {
                mode: 'financial', cyclesPerYear, freshCapacityKg, driedOutputKg, revenuePotential, paybackMonths,
                chart: {
                    points, thresholdY: 0,
                    xLabel: 'Months since purchase', yLabel: 'Cumulative cash flow (EUR)',
                    belowLabel: 'Investment not recovered', aboveLabel: 'Investment recovered',
                    milestoneLabel: paybackMonths ? `Break-even: ${paybackMonths < 1 ? '<1' : Math.round(paybackMonths)} month${paybackMonths >= 1.5 ? 's' : ''}` : 'No break-even reached',
                    xFormatter: v => Math.round(v) + 'm',
                    yFormatter: v => '€' + Math.round(v).toLocaleString(),
                }
            });
        } else {
            /* ===== Équipement sans économie sourcée : graphique de montée en charge d'utilisation ===== */
            const weeks = 16;
            const rampWeeks = 8;
            const startPct = result.projectedRatePct;
            const targetPct = result.currentRatePct;
            const points = [];
            for (let w = 0; w <= weeks; w++) {
                const pct = w >= rampWeeks ? targetPct : startPct + (targetPct - startPct) * (w / rampWeeks);
                points.push({ x: w, y: pct });
            }

            Object.assign(result, {
                mode: 'utilization',
                chart: {
                    points, thresholdY: targetPct,
                    xLabel: 'Weeks in service', yLabel: 'Fleet utilization (%)',
                    belowLabel: 'Below fleet average', aboveLabel: 'At fleet average',
                    milestoneLabel: `Fleet average restored: ~week ${rampWeeks}`,
                    xFormatter: v => 'W' + Math.round(v),
                    yFormatter: v => Math.round(v) + '%',
                }
            });
        }

        return result;
    }

    let whatifChart = null;

    /* Plugin custom : ligne pointillée verticale + étiquette au point de croisement du seuil */
    const milestonePlugin = {
        id: 'milestonePlugin',
        afterDatasetsDraw(chart) {
            const opts = chart.config._whatifMilestone;
            if (!opts) return;
            const { ctx, scales: { x, y } } = chart;
            const px = x.getPixelForValue(opts.crossX);
            const py = y.getPixelForValue(opts.thresholdY);
            const top = chart.chartArea.top, bottom = chart.chartArea.bottom;

            ctx.save();
            ctx.setLineDash([3, 4]);
            ctx.strokeStyle = 'rgba(10,130,118,0.5)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(px, top);
            ctx.lineTo(px, bottom);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#04574f';
            ctx.font = '700 11px Inter, sans-serif';
            ctx.textAlign = 'center';
            const labelX = Math.min(Math.max(px, chart.chartArea.left + 70), chart.chartArea.right - 70);
            ctx.fillText(opts.label, labelX, top + 14);
            ctx.restore();
        }
    };

    /* Crée l'instance Chart.js une seule fois sur le canvas dédié */
    function ensureWhatIfChart() {
        if (whatifChart) return whatifChart;
        const ctx = document.getElementById('whatif-canvas').getContext('2d');
        whatifChart = new Chart(ctx, {
            type: 'line',
            data: { datasets: [] },
            plugins: [milestonePlugin],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 500, easing: 'easeOutQuart' },
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: () => '',
                            label: (ctx) => ctx.dataset._tooltipLabel ? `${ctx.dataset._tooltipLabel}: ${ctx.dataset._fmt(ctx.parsed.y)}` : null
                        },
                        filter: (ctx) => !!ctx.dataset._tooltipLabel
                    }
                },
                scales: {
                    x: {
                        type: 'linear', title: { display: true, text: '', color: '#90A4AE', font: { size: 11 } },
                        grid: { color: '#F2F4F5' },
                        ticks: { color: '#90A4AE', font: { size: 10 }, callback: () => '' }
                    },
                    y: {
                        title: { display: true, text: '', color: '#90A4AE', font: { size: 11 } },
                        grid: { color: '#F2F4F5' },
                        ticks: { color: '#90A4AE', font: { size: 10 }, callback: () => '' }
                    }
                }
            }
        });
        return whatifChart;
    }

    /* Met à jour les données/options du graphique existant (transition animée, pas de recréation) */
    function updateWhatIfChart(cfg) {
        const chart = ensureWhatIfChart();

        /* Point de croisement avec le seuil (interpolation linéaire) */
        let crossX = cfg.points[cfg.points.length - 1].x;
        if (cfg.points[cfg.points.length - 1].y < cfg.thresholdY) {
            crossX = cfg.points[cfg.points.length - 1].x;
        } else if (cfg.points[0].y >= cfg.thresholdY) {
            crossX = cfg.points[0].x;
        } else {
            for (let i = 0; i < cfg.points.length - 1; i++) {
                const p1 = cfg.points[i], p2 = cfg.points[i + 1];
                if ((p1.y - cfg.thresholdY) * (p2.y - cfg.thresholdY) <= 0 && p1.y !== p2.y) {
                    const t = (cfg.thresholdY - p1.y) / (p2.y - p1.y);
                    crossX = p1.x + t * (p2.x - p1.x);
                    break;
                }
            }
        }

        const thresholdData = cfg.points.map(p => ({ x: p.x, y: cfg.thresholdY }));
        const belowData = cfg.points.map(p => ({ x: p.x, y: Math.min(p.y, cfg.thresholdY) }));
        const aboveData = cfg.points.map(p => ({ x: p.x, y: Math.max(p.y, cfg.thresholdY) }));
        const mainData = cfg.points.map(p => ({ x: p.x, y: p.y }));

        chart.data.datasets = [
            { data: thresholdData, borderColor: '#90A4AE', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0, fill: false, tension: 0 },
            { data: belowData, borderWidth: 0, pointRadius: 0, backgroundColor: 'rgba(198,40,40,0.12)', fill: 0, tension: 0.15 },
            { data: aboveData, borderWidth: 0, pointRadius: 0, backgroundColor: 'rgba(46,125,50,0.12)', fill: 0, tension: 0.15 },
            { data: mainData, borderColor: '#0a8276', borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, fill: false, tension: 0.15, _tooltipLabel: cfg.yLabel, _fmt: cfg.yFormatter },
            { data: [{ x: crossX, y: cfg.thresholdY }], borderWidth: 0, pointRadius: 6, pointHoverRadius: 7, pointBackgroundColor: '#0a8276', pointBorderColor: '#fff', pointBorderWidth: 2, showLine: false }
        ];

        chart.options.scales.x.title.text = cfg.xLabel;
        chart.options.scales.x.ticks.callback = (val) => cfg.xFormatter(val);
        chart.options.scales.y.title.text = cfg.yLabel;
        chart.options.scales.y.ticks.callback = (val) => cfg.yFormatter(val);

        chart.config._whatifMilestone = { crossX, thresholdY: cfg.thresholdY, label: cfg.milestoneLabel };
        chart.update();
    }

    /* Construit les champs de formulaire HTML */
    function buildFormFields(fields, values) {
        return fields.map(f => {
            const val = values[f.key] ?? '';
            let input = '';
            const reqAttr = f.required ? 'required' : '';
            const stepAttr = f.step ? `step="${f.step}"` : '';

            if (f.type === 'select') {
                input = `<select name="${f.key}" ${reqAttr}>${f.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
            } else if (f.type === 'asset-select') {
                input = `<select name="${f.key}" ${reqAttr}><option value="">-- Select --</option>${DB.equipment.map(e => `<option value="${e.id}" ${val === e.id ? 'selected' : ''}>${e.id} — ${e.name}</option>`).join('')}</select>`;
            } else if (f.type === 'textarea') {
                input = `<textarea name="${f.key}" ${reqAttr} placeholder="${f.placeholder || ''}">${val}</textarea>`;
            } else {
                input = `<input type="${f.type || 'text'}" name="${f.key}" value="${val}" ${stepAttr} ${reqAttr} placeholder="${f.placeholder || ''}">`;
            }
            return `<div class="form-group"><label>${f.label}</label>${input}<div class="field-error">This field is required.</div></div>`;
        }).join('');
    }

    /* Sauvegarde (ajout ou mise à jour) */
    function saveItem() {
        const { key, index } = currentEdit;
        const cfg = ENTITY[key];
        const form = modalBody;
        const data = {};
        let valid = true;

        /* Collecter et valider */
        cfg.fields.forEach(f => {
            const el = form.querySelector(`[name="${f.key}"]`);
            const group = el.closest('.form-group');
            let val = el.value.trim();
            if (f.type === 'number' && val !== '') val = parseFloat(val);
            data[f.key] = val;
            if (f.required && (val === '' || val === null || val === undefined || (typeof val === 'number' && isNaN(val)))) {
                group.classList.add('has-error');
                valid = false;
            } else {
                group.classList.remove('has-error');
            }
        });

        if (!valid) return;

        if (index === -1) {
            /* Ajout */
            data.id = genId(key);
            DB[key].push(data);
            toast('Record added successfully', 'success');
        } else {
            /* Mise à jour */
            data.id = DB[key][index].id; /* conserver l'ID */
            DB[key][index] = data;
            toast('Record updated successfully', 'success');
        }

        hideModal();
        renderAll();
    }

        modalFoot.innerHTML = `<button class="btn btn-ghost" onclick="hideModal()">Cancel</button><button class="btn btn-danger" onclick="doDelete()">Delete</button>`;
        currentEdit = { key, index };
        showModal();
    }

    function doDelete() {
        const { key, index } = currentEdit;
        DB[key].splice(index, 1);
        hideModal();
        toast('Record deleted', 'error');
        renderAll();
    }

    /* ============================================================
       TOASTS
       ============================================================ */
    function toast(msg, type = 'info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${type === 'success' ? '<path d="M20 6L9 17l-5-5"></path>' : type === 'error' ? '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>' : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'}</svg>${msg}`;
        container.appendChild(el);
        setTimeout(() => { el.classList.add('removing'); }, 2600);
        setTimeout(() => { el.remove(); }, 2900);
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    const TITLES = {
        dashboard:'Dashboard Overview', equipment:'Equipment Registry',
        maintenance:'Maintenance Schedule', usage:'Usage & Fuel Log',
        repairs:'Repair Log', operators:'Operator Assignment', spares:'Spare Parts Inventory',
        whatif:'What-If Scenario Analysis'
    };

    function renderAll() {
        renderDashboard();
        renderEquipment();
        renderMaintenance();
        renderUsage();
        renderRepairs();
        renderOperators();
        renderSpares();
        renderWhatIf();
    }

    /* Construit la structure statique du panneau (formulaire) puis lance un premier rendu des résultats */
    function renderWhatIf() {
        const optionsByCategory = {};
        WHATIF_CATALOG.forEach(item => {
            if (!optionsByCategory[item.category]) optionsByCategory[item.category] = [];
            optionsByCategory[item.category].push(item);
        });
        const selectOptions = Object.entries(optionsByCategory).map(([cat, items]) =>
            `<optgroup label="${cat}">${items.map(i => `<option value="${i.id}">${i.label} — €${i.unitCost.toLocaleString()}</option>`).join('')}</optgroup>`
        ).join('');

        const html = `
        <div class="whatif-intro">Drag the sliders to simulate adding equipment to the fleet. Results and chart update live, with animated transitions. Unit costs and dryer capacity figures are sourced from the 2025 cohort's cost data, not placeholders.</div>
        <div class="whatif-layout">
            <div class="whatif-panel">
                <div class="whatif-panel-title">
                    <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                    Hypothesis
                </div>

                <div class="whatif-field">
                    <div class="whatif-field-label"><span>Equipment to add</span></div>
                    <select id="whatif-item" class="whatif-select">${selectOptions}</select>
                </div>

                <div class="whatif-field">
                    <div class="whatif-field-label"><span>Quantity</span><span class="val" id="whatif-qty-val">1 unit</span></div>
                    <input type="range" id="whatif-qty" class="whatif-slider" min="1" max="10" step="1" value="1">
                </div>

                <div id="whatif-dryer-toggle"></div>

                <div class="whatif-source-tag" id="whatif-source-tag"></div>
            </div>

            <div class="whatif-results-panel">
                <div class="whatif-panel-title">
                    <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                    Results
                </div>
                <div id="whatif-rows"></div>

                <div class="whatif-chart-wrap">
                    <div class="whatif-chart-title" id="whatif-chart-title"></div>
                    <div class="whatif-chart-canvas-box">
                        <canvas id="whatif-canvas"></canvas>
                    </div>
                    <div class="whatif-chart-legend">
                        <span><span class="swatch" style="background:#c62828;opacity:0.5;"></span><span id="whatif-legend-below"></span></span>
                        <span><span class="swatch" style="background:#2E7D32;opacity:0.5;"></span><span id="whatif-legend-above"></span></span>
                        <span><span class="swatch" style="background:#0a8276;border-radius:50%;"></span>Threshold point</span>
                    </div>
                </div>
                <div class="whatif-source-note" id="whatif-source-note"></div>
            </div>
        </div>`;

        document.getElementById('whatif').innerHTML = html;
        whatifChart = null; /* le canvas vient d'être recréé, on force une nouvelle instance Chart.js */
        bindWhatIfEvents();
        updateWhatIf();
    }

    /* Branche les écouteurs pour une mise à jour en direct (sliders + toggle + select) */
    function bindWhatIfEvents() {
        const itemSelect = document.getElementById('whatif-item');
        const qtySlider = document.getElementById('whatif-qty');

        itemSelect.addEventListener('change', () => { renderDryerToggle(); updateWhatIf(); });
        qtySlider.addEventListener('input', updateWhatIf);

        renderDryerToggle();
    }

    /* Affiche le toggle "Full seasonal capacity" uniquement quand le Dryer est sélectionné */
    function renderDryerToggle() {
        const itemSelect = document.getElementById('whatif-item');
        const item = WHATIF_CATALOG.find(i => i.id === itemSelect.value);
        const container = document.getElementById('whatif-dryer-toggle');
        if (item && item.capacityPerCycleKg) {
            container.innerHTML = `
            <div class="whatif-toggle-card">
                <div class="whatif-toggle-text">
                    <strong>Full seasonal capacity</strong>
                    <span>Off: 8 cycles/yr (current farm baseline). On: 32 cycles per 4-month campaign (max).</span>
                </div>
                <label class="whatif-switch">
                    <input type="checkbox" id="whatif-fullcap">
                    <span class="slider-el"></span>
                </label>
            </div>`;
            document.getElementById('whatif-fullcap').addEventListener('change', updateWhatIf);
        } else {
            container.innerHTML = '';
        }
    }

    /* Recalcule et met à jour les résultats + le graphique en direct (canvas conservé, transition animée) */
    function updateWhatIf() {
        const itemSelect = document.getElementById('whatif-item');
        const qtySlider = document.getElementById('whatif-qty');
        const item = WHATIF_CATALOG.find(i => i.id === itemSelect.value);
        const qty = parseInt(qtySlider.value, 10);
        const fullCapToggle = document.getElementById('whatif-fullcap');
        const fullCapacity = fullCapToggle ? fullCapToggle.checked : false;

        document.getElementById('whatif-qty-val').textContent = qty + (qty > 1 ? ' units' : ' unit');
        document.getElementById('whatif-source-tag').textContent = 'Source: ' + item.source;

        const result = computeWhatIf(item.id, qty, fullCapacity);
        renderResultRows(result);
        document.getElementById('whatif-chart-title').textContent = result.mode === 'financial' ? 'Investment Break-Even Projection' : 'Utilization Ramp-Up Projection';
        document.getElementById('whatif-legend-below').textContent = result.chart.belowLabel;
        document.getElementById('whatif-legend-above').textContent = result.chart.aboveLabel;
        document.getElementById('whatif-source-note').textContent = result.mode === 'financial'
            ? "CAPEX and dryer capacity figures are sourced from the 2025 cohort's cost data. The break-even projection assumes steady monthly revenue at full modeled output — a planning estimate, not a financial guarantee."
            : "Investment cost is sourced from the 2025 cohort's cost data. No revenue or loss-reduction figures were sourced for this equipment type, so the chart shows a fleet utilization ramp-up projection instead of a financial break-even.";
        updateWhatIfChart(result.chart);
    }

    /* Construit uniquement les lignes de résultats textuelles */
    function renderResultRows(r) {
        let html = `
        <div class="whatif-result-row"><span class="label">Investment cost</span><span class="value">€${r.capex.toLocaleString()}</span></div>`;

        if (r.mode === 'financial') {
            html += `
            <div class="whatif-result-row"><span class="label">Additional capacity</span><span class="value">${(r.driedOutputKg/1000).toFixed(1)} t dried / year</span></div>
            <div class="whatif-result-row"><span class="label">Fresh input required</span><span class="value muted">${Math.round(r.freshCapacityKg).toLocaleString()} kg/year (${r.cyclesPerYear} cycles)</span></div>
            <div class="whatif-result-row"><span class="label">Annual benefit</span><span class="value positive">€${Math.round(r.revenuePotential).toLocaleString()}</span></div>
            <div class="whatif-result-row"><span class="label">Payback period</span><span class="value">${r.paybackMonths ? (r.paybackMonths < 1 ? '<1 month' : (r.paybackMonths/12).toFixed(1) + ' years') : 'n/a'}</span></div>`;
        } else {
            html += `
            <div class="whatif-result-row"><span class="label">Added fleet capacity</span><span class="value">${(40 * r.qty)} h/week</span></div>
            <div class="whatif-result-row"><span class="label">Fleet utilization</span><span class="value">${r.currentRatePct}% → ${r.projectedRatePct}% at rollout</span></div>
            <div class="whatif-result-row"><span class="label">Annual benefit</span><span class="value muted">No revenue model sourced for this equipment type</span></div>`;
        }

        document.getElementById('whatif-rows').innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderAll();

        const navItems = document.querySelectorAll('.nav-item');
        const pages = document.querySelectorAll('.page');
        const pageTitle = document.getElementById('page-title');

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const target = item.getAttribute('data-page');
                navItems.forEach(n => n.classList.remove('active'));
                pages.forEach(p => p.classList.remove('active'));
                item.classList.add('active');
                document.getElementById(target).classList.add('active');
                pageTitle.textContent = TITLES[target];
            });
        });

        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                logoutBtn.querySelector('span').textContent = 'Logged out';
                logoutBtn.disabled = true;
                logoutBtn.style.opacity = '0.6';
            });
        }
    });
    </script>
</body>
</html>
